<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — Élection Adjouan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f4f8; color: #1c2d3d; padding: 20px; }
    header { background-color: #0b6638; color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { color: #0b6638; margin-bottom: 15px; font-size: 1.2rem; }
    label { display: block; margin-top: 10px; font-weight: 600; font-size: 0.9rem; }
    input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e0; border-radius: 8px; }
    .btn { background-color: #0b6638; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .btn-danger { background-color: #e53e3e; margin-top: 5px; padding: 6px 12px; width: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
    th { background-color: #f8fafc; color: #0b6638; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <h1>Espace Administration</h1>
    <p>Gestion des candidats & Résultats</p>
  </header>

  <div style="max-width: 600px; margin: 0 auto;">

    <!-- AJOUTER UN CANDIDAT -->
    <div class="card">
      <h2>➕ Ajouter un Candidat</h2>
      <form id="form-candidat">
        <label>Nom & Prénom du candidat</label>
        <input type="text" id="cand-nom" required placeholder="Ex: Yao Kouadio">

        <label>Profession / Description</label>
        <input type="text" id="cand-prof" placeholder="Ex: Enseignant">

        <label>Programme / Slogan</label>
        <textarea id="cand-prog" rows="3" placeholder="Résumé du programme..."></textarea>

        <button type="submit" class="btn">Enregistrer le candidat</button>
      </form>
    </div>

    <!-- LISTE DES CANDIDATS & RÉSULTATS -->
    <div class="card">
      <h2>📊 Résultats & Candidats</h2>
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Voix</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="table-candidats">
          <tr><td colspan="3">Chargement...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // Remplace par tes véritables clés Supabase
    const SUPABASE_URL = 'https://gjoxpvatxxexuzxyhgqm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_45SBmGTiYtsCv5QEmYIovQ_WiAzSrCl';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function chargerDonnees() {
      const tbody = document.getElementById('table-candidats');
      const { data: candidats, error } = await supabaseClient.from('candidats').select('*');

      if (error) {
        tbody.innerHTML = '<tr><td colspan="3">Erreur de chargement.</td></tr>';
        return;
      }

      if (!candidats || candidats.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3">Aucun candidat pour le moment.</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      candidats.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td><strong>${c.nom_prenom}</strong></td>
            <td><strong>${c.nombre_voix || 0}</strong> vote(s)</td>
            <td>
              <button class="btn btn-danger" onclick="supprimerCandidat('${c.id}')">Supprimer</button>
            </td>
          </tr>
        `;
      });
    }

    document.getElementById('form-candidat').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nom = document.getElementById('cand-nom').value;
      const prof = document.getElementById('cand-prof').value;
      const prog = document.getElementById('cand-prog').value;

      const { error } = await supabaseClient.from('candidats').insert([{
        nom_prenom: nom,
        profession: prof,
        programme: prog,
        nombre_voix: 0
      }]);

      if (error) {
        alert('Erreur : ' + error.message);
      } else {
        alert('Candidat ajouté avec succès !');
        document.getElementById('form-candidat').reset();
        chargerDonnees();
      }
    });

    async function supprimerCandidat(id) {
      if (!confirm('Voulez-vous vraiment supprimer ce candidat ?')) return;

      const { error } = await supabaseClient.from('candidats').delete().eq('id', id);
      if (error) {
        alert('Erreur : ' + error.message);
      } else {
        chargerDonnees();
      }
    }

    chargerDonnees();
  </script>
</body>
</html>
