<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Élections Jeunesse d'Adjouan</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; color: #1c1e21; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: #ffffff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2 { color: #004d40; margin-top: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; color: #4b5563; }
    input[type="text"], textarea, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; }
    button { background-color: #004d40; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #00332c; }
    button:disabled { background-color: #9ca3af; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 0.9rem; }
    th { background-color: #f9fafb; color: #374151; }
    .img-preview { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
    .btn-danger { background-color: #dc2626; padding: 6px 10px; font-size: 0.8rem; width: auto; }
    .btn-danger:hover { background-color: #b91c1c; }
    .badge { background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- RÉSULTATS -->
  <div class="card">
    <h2>🗳️ Résultats en direct</h2>
    <div id="resultats-container">Chargement...</div>
    <button onclick="chargerDonnees()" style="margin-top: 12px; background-color: #1e293b;">🔄 Rafraîchir les données</button>
  </div>

  <!-- AJOUTER UN CANDIDAT -->
  <div class="card">
    <h2>👥 Ajouter un Candidat</h2>
    <form id="form-candidat" onsubmit="ajouterCandidat(event)">
      <div class="form-group">
        <label>Nom et Prénom :</label>
        <input type="text" id="nom_candidat" required placeholder="Ex: Kouamé N'diamoi Theodore">
      </div>
      <div class="form-group">
        <label>Profession :</label>
        <input type="text" id="profession_candidat" required placeholder="Ex: Entrepreneur">
      </div>
      <div class="form-group">
        <label>Ambition / Message :</label>
        <textarea id="ambition_candidat" rows="3" required placeholder="Votre message aux jeunes..."></textarea>
      </div>
      <div class="form-group">
        <label>Photo de profil :</label>
        <input type="file" id="photo_candidat" accept="image/*" required>
      </div>
      <button type="submit" id="btn-ajouter">➕ Enregistrer le candidat</button>
    </form>
  </div>

  <!-- LISTE DES CANDIDATS -->
  <div class="card">
    <h2>Liste des candidats</h2>
    <table>
      <thead>
        <tr>
          <th>Photo</th>
          <th>Candidat</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="liste-candidats"></tbody>
    </table>
  </div>

  <!-- LISTE DES ÉLECTEURS -->
  <div class="card">
    <h2>📋 Électeurs Inscrits (<span id="total-electeurs">0</span>)</h2>
    <table>
      <thead>
        <tr>
          <th>Nom & Prénom</th>
          <th>Pièce</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="liste-electeurs"></tbody>
    </table>
  </div>

</div>

<script>
  // CLÉS SUPABASE
  const SUPABASE_URL = 'https://qktfqpsqmcrgtmauntfj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_45SBmGTiYtsCv5QEmYIovQ_WiAzSrCl';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function chargerDonnees() {
    await chargerCandidats();
    await chargerElecteurs();
    await chargerResultats();
  }

  async function chargerCandidats() {
    const tbody = document.getElementById('liste-candidats');
    tbody.innerHTML = '';
    const { data: candidats } = await supabaseClient.from('candidats').select('*');
    if (candidats) {
      candidats.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td><img src="${c.photo_url}" class="img-preview" alt="${c.nom_prenom}"></td>
            <td><strong>${c.nom_prenom}</strong><br><small style="color:#6b7280">${c.profession}</small></td>
            <td><button class="btn-danger" onclick="supprimerCandidat('${c.id}')">Supprimer</button></td>
          </tr>
        `;
      });
    }
  }

  async function ajouterCandidat(e) {
    e.preventDefault();
    const nom = document.getElementById('nom_candidat').value;
    const profession = document.getElementById('profession_candidat').value;
    const ambition = document.getElementById('ambition_candidat').value;
    const fileInput = document.getElementById('photo_candidat');
    const btn = document.getElementById('btn-ajouter');

    if (!fileInput.files || fileInput.files.length === 0) {
      alert("Veuillez sélectionner une photo.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Téléversement en cours...";

    try {
      const file = fileInput.files[0];
      const fileExt = file.name.split('.').pop();
      const fileName = `candidat_${Date.now()}.${fileExt}`;

      const { error: uploadError } = await supabaseClient.storage
        .from('pieces_identite')
        .upload(fileName, file);

      if (uploadError) throw uploadError;

      const { data: urlData } = supabaseClient.storage
        .from('pieces_identite')
        .getPublicUrl(fileName);

      const photoUrl = urlData.publicUrl;

      const { error: insertError } = await supabaseClient.from('candidats').insert([{
        nom_prenom: nom,
        profession: profession,
        ambition: ambition,
        photo_url: photoUrl
      }]);

      if (insertError) throw insertError;

      document.getElementById('nom_candidat').value = '';
      document.getElementById('profession_candidat').value = '';
      document.getElementById('ambition_candidat').value = '';
      fileInput.value = '';
      chargerDonnees();

    } catch (err) {
      alert("Erreur : " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "➕ Enregistrer le candidat";
    }
  }

  async function supprimerCandidat(id) {
    if (confirm("Supprimer ce candidat ?")) {
      await supabaseClient.from('candidats').delete().eq('id', id);
      chargerDonnees();
    }
  }

  async function chargerElecteurs() {
    const tbody = document.getElementById('liste-electeurs');
    const totalSpan = document.getElementById('total-electeurs');
    tbody.innerHTML = '';
    const { data: electeurs } = await supabaseClient.from('electeurs').select('*');
    if (electeurs) {
      totalSpan.textContent = electeurs.length;
      electeurs.forEach(e => {
        tbody.innerHTML += `
          <tr>
            <td>${e.nom_prenom}</td>
            <td><span class="badge">${e.type_piece}</span></td>
            <td><a href="${e.numero_piece}" target="_blank" style="color:#004d40;font-weight:bold;">Voir</a></td>
          </tr>
        `;
      });
    }
  }

  async function chargerResultats() {
    const container = document.getElementById('resultats-container');
    const { data: votes } = await supabaseClient.from('votes').select('*');
    const { data: candidats } = await supabaseClient.from('candidats').select('*');

    if (!candidats || candidats.length === 0) {
      container.innerHTML = '<p style="color:#6b7280;">Aucun candidat enregistré.</p>';
      return;
    }

    const decompte = {};
    candidats.forEach(c => decompte[c.id] = { nom: c.nom_prenom, voix: 0 });

    if (votes) {
      votes.forEach(v => {
        if (decompte[v.candidat_id]) decompte[v.candidat_id].voix++;
      });
    }

    let html = '<table><thead><tr><th>Candidat</th><th>Voix</th></tr></thead><tbody>';
    Object.values(decompte).forEach(c => {
      html += `<tr><td><strong>${c.nom}</strong></td><td><span class="badge">${c.voix} voix</span></td></tr>`;
    });
    html += '</tbody></table>';

    container.innerHTML = html;
  }

  chargerDonnees();
</script>

</body>
</html>
